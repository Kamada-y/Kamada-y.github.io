<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>週間気温チェック｜今週の服装プランナー</title>
  <!-- Bootstrap 5.3.8 (固定) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- カスタムCSS -->
  <link rel="stylesheet" href="style.css">
<style>
    body {
    background-color: #f4f6f9;
    color: #333333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    }

    .main-wrapper {
    max-width: 860px;
    }

    .card {
    border-radius: 12px;
    }

    .chart-container {
    position: relative;
    height: 360px;
    width: 100%;
    }

    @media (max-width: 576px) {
    .chart-container {
        height: 290px;
    }
    }
</style>
</head>


<body>
  <div class="container py-4 py-md-5 main-wrapper">
    <!-- ヘッダー -->
    <header class="mb-4 text-center">
      <h1 class="h3 fw-bold text-dark mb-1">今週の気温と服装チェック</h1>
      <p class="text-muted small mb-0">週間予報の最高・最低気温から寒い日を確認</p>
    </header>

    <!-- コントロールカード（地域選択） -->
    <section class="card shadow-sm border-0 mb-4">
      <div class="card-body p-3 p-md-4">
        <div class="row g-3 align-items-center">
          <div class="col-md-6">
            <label for="areaSelect" class="form-label fw-semibold mb-1">地域を選択（47都道府県）</label>
            <select id="areaSelect" class="form-select">
              <option value="016000">北海道（札幌）</option>
              <option value="020000">青森県（青森）</option>
              <option value="030000">岩手県（盛岡）</option>
              <option value="040000">宮城県（仙台）</option>
              <option value="050000">秋田県（秋田）</option>
              <option value="060000">山形県（山形）</option>
              <option value="070000">福島県（福島）</option>
              <option value="080000">茨城県（水戸）</option>
              <option value="090000">栃木県（宇都宮）</option>
              <option value="100000">群馬県（前橋）</option>
              <option value="110000">埼玉県（さいたま）</option>
              <option value="120000">千葉県（千葉）</option>
              <option value="130000" selected>東京都（東京）</option>
              <option value="140000">神奈川県（横浜）</option>
              <option value="150000">新潟県（新潟）</option>
              <option value="160000">富山県（富山）</option>
              <option value="170000">石川県（金沢）</option>
              <option value="180000">福井県（福井）</option>
              <option value="190000">山梨県（甲府）</option>
              <option value="200000">長野県（長野）</option>
              <option value="210000">岐阜県（岐阜）</option>
              <option value="220000">静岡県（静岡）</option>
              <option value="230000">愛知県（名古屋）</option>
              <option value="240000">三重県（津）</option>
              <option value="250000">滋賀県（大津）</option>
              <option value="260000">京都府（京都）</option>
              <option value="270000">大阪府（大阪）</option>
              <option value="280000">兵庫県（神戸）</option>
              <option value="290000">奈良県（奈良）</option>
              <option value="300000">和歌山県（和歌山）</option>
              <option value="310000">鳥取県（鳥取）</option>
              <option value="320000">島根県（松江）</option>
              <option value="330000">岡山県（岡山）</option>
              <option value="340000">広島県（広島）</option>
              <option value="350000">山口県（下関）</option>
              <option value="360000">徳島県（徳島）</option>
              <option value="370000">香川県（高松）</option>
              <option value="380000">愛媛県（松山）</option>
              <option value="390000">高知県（高知）</option>
              <option value="400000">福岡県（福岡）</option>
              <option value="410000">佐賀県（佐賀）</option>
              <option value="420000">長崎県（長崎）</option>
              <option value="430000">熊本県（熊本）</option>
              <option value="440000">大分県（大分）</option>
              <option value="450000">宮崎県（宮崎）</option>
              <option value="460100">鹿児島県（鹿児島）</option>
              <option value="471000">沖縄県（那覇）</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <!-- グラフカード -->
    <section class="card shadow-sm border-0 mb-4">
      <div class="card-body p-3 p-md-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 id="chartTitle" class="h5 fw-bold mb-0">東京都の週間気温推移</h2>
          <span id="updateTime" class="badge bg-light text-secondary border"></span>
        </div>

        <!-- エラー表示用 -->
        <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>

        <!-- ローディング表示 -->
        <div id="loadingSpinner" class="text-center py-5 d-none">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="text-muted small mt-2 mb-0">気象庁データを取得中...</p>
        </div>

        <!-- 折れ線グラフキャンバス -->
        <div class="chart-container">
          <canvas id="tempChart"></canvas>
        </div>

        <!-- Nice機能：いちばん寒い日の表示（折れ線グラフの下） -->
        <div id="coldestAlert" class="alert alert-primary mt-4 mb-0 py-2 px-3 d-flex align-items-center" role="alert">
          <div id="coldestText" class="small">データを読み込み中です...</div>
        </div>
      </div>
    </section>

    <!-- フッター（必須の出典表記） -->
    <footer class="text-center text-muted small pt-2">
      <p class="mb-0">
        出典：<a href="https://www.jma.go.jp/" target="_blank" rel="noopener noreferrer" class="text-decoration-none text-secondary fw-semibold">気象庁ホームページ</a>
      </p>
    </footer>
  </div>

  <!-- Bootstrap 5.3.8 JS Bundle (固定) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Chart.js 4.4.1 (固定) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- メインスクリプト -->
  <script src="main.js"></script>
</body>
</html>
