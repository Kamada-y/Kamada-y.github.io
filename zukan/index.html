<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>キャラ図鑑</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous"> <!--CSSのリンク-->
    <style>
        body{
            background-color:rgb(195, 167, 237);
            margin: 40px;
        }

        h1{
            font-size:50px;
        }

        .btn-outline-secondary{
            background-color:rgb(232, 213, 239)
        }


        .card-img {
            width: 100%;
            max-width: 120px;  /* これ以上は大きくならない上限を決められる*/
            height: auto;
            aspect-ratio: 1 / 1;  /*常に正方形の比率を保つ（ウィンドウを縮めても上下に隙間ができない)*/
            object-fit: contain;
            object-position: left center;
            color:rgb(232, 213, 239) ;
            border-radius: 5px;
        }
        .card{
            background-color:rgb(232, 213, 239) ;
            padding:8px;
            border-radius: 5px;
            font-size:large;

        }

        #characterCount{
            text-align:right; 
            font-size:20px;
        }

        .type-tab{
            flex: 1;
            padding:6px;
            font-size: 15px;
            font-weight: bold;
            white-space: nowrap;  /* 文字が途中で改行されるのを禁止する */ 
        }

        .container{
            max-width: 1000px;
        }

</style>

    
</head>
<body>
    
    <div class="container mt-4">
        <h1>キャラ図鑑</h1>
        <div id="AllButton" class="button mt-4 mb-3 d-flex gap-2">    <!-- d-flex gap-2は、ボタンが横一列（フレックスボックス）に固定されて、折り返されなくなる-->
            <button class="btn btn-secondary btn-lg type-tab">すべて</button>
            <button class="btn btn-outline-secondary btn-lg type-tab">炎</button>
            <button class="btn btn-outline-secondary btn-lg type-tab">水</button>
            <button class="btn btn-outline-secondary btn-lg type-tab">草</button>
            <button class="btn btn-outline-secondary btn-lg type-tab">お気に入り</button>
        </div>
        <p id="characterCount"></p>
        <div class="row g-2 mb-3">
            <div class="col-6">
                <input id="searchInput" placeholder="名前で検索" class="form-control">
            </div>
            <div class="col-6">
                <select id="sortSelect" class="form-select">
                    <option value="default">登録順</option>
                    <option value="attackDesc">攻撃力が高い順</option>
                    <option value="attackAsc">攻撃力が低い順</option>
                    <option value="rarityDesc">レア度が高い順</option>
                </select>
            </div>
        </div>
        <div id="characterList" class="row g-3 mt-4"></div>
       
        
    </div>

    <script src="https://morimorihoge.github.io/teu2026f/characters.js"></script>
    <script src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>  <!--JSのリンク-->

</body>
</html>
